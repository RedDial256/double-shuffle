name: Release Please

# Keeps a release PR open with the next version and CHANGELOG, computed from
# the Conventional Commits on main. Merging it tags vX.Y.Z and creates the
# GitHub Release. Config: release-please-config.json. Process: docs/releasing.md.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
