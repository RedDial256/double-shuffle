name: Security

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rnsec:
    # rnsec + npm audit on app/, compared with app/security/rnsec-baseline.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run security -- --reports rnsec-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnsec-reports
          path: app/rnsec-reports
